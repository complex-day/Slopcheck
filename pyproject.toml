[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slopcheck"
version = "0.1.0"
description = "A minimal code quality CLI tool."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter",
    "tree-sitter-python",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
slopcheck = "slopcheck.cli:main"
